name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate String Catalog
        run: python3 -m json.tool Sources/PortHarborApp/Resources/Localizable.xcstrings > /dev/null
      - name: Unit and integration tests
        run: swift test
      - name: Release build
        run: swift build -c release
      - name: Runtime listener smoke test
        run: PORTHARBOR_LIVE_TEST=1 swift test --scratch-path /tmp/PortHarbor-live --filter liveProviderDiscoversCurrentMacListeners
      - name: Package smoke test
        run: PACKAGE_ONLY=1 ARCH=$(uname -m) ./scripts/package-local-app.sh | tail -n 1 | xargs test -d
      - name: Distribution script syntax
        run: |
          sh -n scripts/package-local-app.sh
          sh -n scripts/release.sh
          sh -n scripts/generate-distribution-metadata.sh
          sh -n scripts/ui-smoke.sh
          sh -n scripts/performance-smoke.sh
