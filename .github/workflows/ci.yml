name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate String Catalog
        run: python3 -m json.tool Sources/PortHarborApp/Resources/Localizable.xcstrings > /dev/null
      - name: Unit and integration tests
        run: swift test
      - name: Release build
        run: swift build -c release
      - name: Runtime listener smoke test
        run: |
          python3 -m http.server 0 --bind 127.0.0.1 > /tmp/portharbor-ci-listener.log 2>&1 &
          listener_pid=$!
          trap 'kill "$listener_pid" 2>/dev/null || true' EXIT
          sleep 1
          if /usr/sbin/lsof -nP -iTCP -sTCP:LISTEN -FpcfntT > /tmp/portharbor-ci-lsof.out 2> /tmp/portharbor-ci-lsof.err; then
            PORTHARBOR_LIVE_TEST=1 swift test --scratch-path /tmp/PortHarbor-live --filter liveProviderDiscoversCurrentMacListeners
          else
            echo "Hosted runner does not expose TCP listeners through lsof; live discovery is covered by the local release smoke record."
            cat /tmp/portharbor-ci-lsof.err
          fi
      - name: Package smoke test
        run: PACKAGE_ONLY=1 ARCH=$(uname -m) ./scripts/package-local-app.sh | tail -n 1 | xargs test -d
      - name: Distribution script syntax
        run: |
          sh -n scripts/package-local-app.sh
          sh -n scripts/release.sh
          sh -n scripts/generate-distribution-metadata.sh
          sh -n scripts/ui-smoke.sh
          sh -n scripts/performance-smoke.sh
