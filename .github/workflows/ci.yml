name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate String Catalog
        run: |
          python3 -m json.tool Sources/PortHarborApp/Resources/Localizable.xcstrings > /dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(
              Path("Sources/PortHarborApp/Resources/Localizable.xcstrings").read_text()
          )
          strings = catalog.get("strings", {})
          required = {
              "Services",
              "Activity",
              "Refresh",
              "Open in Browser",
              "Show in Finder",
              "Safe Stop",
              "Settings",
              "Quit PortHarbor",
              "Recent Activity",
              "View Full History",
              "First seen",
              "Running for",
              "Restarts",
          }
          missing = sorted(required - strings.keys())
          if not strings or missing:
              raise SystemExit(
                  "String Catalog is empty or missing required keys: "
                  + ", ".join(missing)
              )
          PY
      - name: Unit and integration tests
        run: swift test
      - name: Release build
        run: swift build -c release
      - name: Runtime listener smoke test
        run: |
          python3 -m http.server 0 --bind 127.0.0.1 > /tmp/portharbor-ci-listener.log 2>&1 &
          listener_pid=$!
          trap 'kill "$listener_pid" 2>/dev/null || true' EXIT
          sleep 1
          if /usr/sbin/lsof -nP -iTCP -sTCP:LISTEN -FpcfntT > /tmp/portharbor-ci-lsof.out 2> /tmp/portharbor-ci-lsof.err; then
            PORTHARBOR_LIVE_TEST=1 swift test --scratch-path /tmp/PortHarbor-live --filter liveProviderDiscoversCurrentMacListeners
          else
            echo "Hosted runner does not expose TCP listeners through lsof; live discovery is covered by the local release smoke record."
            cat /tmp/portharbor-ci-lsof.err
          fi
      - name: Package smoke test
        run: |
          app=$(PACKAGE_ONLY=1 ARCH=$(uname -m) ./scripts/package-local-app.sh | tail -n 1)
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$app/Contents/Info.plist")" = "YL33FrdCjDXEfkZXNKVFzBf+lqjKcCwFRKB3KHecEZA="
          test "$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$app/Contents/Info.plist")" = "https://raw.githubusercontent.com/fmbabacan/PortHarbor/main/appcast.xml"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SUEnableAutomaticChecks' "$app/Contents/Info.plist")" = "true"
          test -d "$app/Contents/Frameworks/Sparkle.framework"
          test -s "$app/Contents/Resources/Localizable.xcstrings"
          otool -l "$app/Contents/MacOS/PortHarbor" | grep -Fq "@executable_path/../Frameworks"
          isolated_root=$(mktemp -d /tmp/portharbor-ci-app.XXXXXX)
          cp -R "$app" "$isolated_root/PortHarbor.app"
          isolated_app="$isolated_root/PortHarbor.app"
          "$isolated_app/Contents/MacOS/PortHarbor" > /tmp/portharbor-startup.log 2>&1 &
          app_pid=$!
          sleep 8
          kill -0 "$app_pid"
          kill "$app_pid"
          wait "$app_pid" || true
          if grep -Eq 'Library not loaded|dyld|could not load resource bundle|SIGTRAP|Trace/BPT|fatal error' /tmp/portharbor-startup.log; then
            cat /tmp/portharbor-startup.log
            exit 1
          fi
      - name: Distribution script syntax
        run: |
          sh -n scripts/package-local-app.sh
          sh -n scripts/release.sh
          sh -n scripts/generate-distribution-metadata.sh
          sh -n scripts/ui-smoke.sh
          sh -n scripts/performance-smoke.sh
